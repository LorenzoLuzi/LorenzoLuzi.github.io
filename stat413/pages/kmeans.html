    SOURCES (kept in source; not displayed in the applet UI)
    - Data: Palmer penguins (Gorman et al. 2014, CC0), datasets/penguins.csv — flipper
      length (mm) x bill length (mm), n = 342, species kept ONLY for the optional
      end-of-run reveal (the algorithm never sees them).
    - K-means runs in STANDARDIZED coordinates (z-scores per axis; k-means is scale-
      sensitive), displayed on the raw axes. L^(t) is reported in standardized units.
    - Initialization follows the lecture notes exactly: step 1 assigns each point a
      random label 1..k (NOT random centroid positions). Step 2a recomputes each
      cluster's mean; step 2b reassigns each point to its nearest mean (Euclidean).
      Empty clusters keep their outdated mean ("we keep track of this even if it gets
      outdated").
    - The loss trace plots L after EVERY HALF-STEP, which is the convergence proof from
      the notes: 2a can only lower L (the mean minimizes sum of squared distances for
      fixed assignments), 2b can only lower L (each point moves to a nearer center for
      fixed means); L >= 0 and there are finitely many partitions, so it must stop.
    - Voronoi cells (d3-delaunay, in the d3 v7 bundle) visualize "nearest mean".
  -->

  function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  const texc = (hex, s) => `\\textcolor[RGB]{${hexRGB(hex.replace('#', ''))}}{${s}}`;
  function mjRun(els) {                     // ALL typesets share ONE chain — MathJax v3
    window.__mjChain = (window.__mjChain || Promise.resolve())   // corrupts on overlaps
      .then(() => { const live = (els || []).filter(e => e && e.isConnected);

      .catch(() => {});
    return window.__mjChain;

  let typesetTimer = null;
  const typesetQueue = new Set();          // accumulate: a burst of calls must typeset ALL
  function typesetSoon(el) {               // queued elements, not just the last one
    if (el) typesetQueue.add(el);
    if (typesetTimer) clearTimeout(typesetTimer);
    typesetTimer = setTimeout(() => {
      const els = [...typesetQueue];

  // into a HIDDEN child and swapped in only once MathJax has typeset it, so the visible equation
  // never flashes back to raw TeX; unchanged TeX is not re-typeset at all
  function MathSlot(el, tag) {
    this.a = document.createElement(tag || 'span'); this.b = document.createElement(tag || 'span');
    this.b.style.display = 'none'; el.append(this.a, this.b);
    this.showA = true; this.cur = null; this.pending = null; this.timer = null;
  }
  MathSlot.prototype.set = function (tex) {
    if (tex === this.cur && this.pending == null) return;
    this.pending = tex;
    if (this.timer) return;
    this.timer = setTimeout(() => { this.timer = null; this.flush(); }, 60);
  };
  MathSlot.prototype.flush = function () {
    const tex = this.pending; this.pending = null;
    if (tex == null || tex === this.cur) return;
    this.cur = tex;
    const hidden = this.showA ? this.b : this.a, vis = this.showA ? this.a : this.b;
    hidden.innerHTML = tex; this.showA = !this.showA;
    mjRun([hidden]).then(() => { hidden.style.display = ''; vis.style.display = 'none'; });
  };

  // standardized coordinates (k-means is scale-sensitive)
  const MEANS = [d3.mean(RAW, r => r[0]), d3.mean(RAW, r => r[1])];

  const zdist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;

  // ============================ Lloyd state ==================================
  // phase: which half-step comes NEXT. t = the notes' time index (bumped by 2a).
  const S = { k: 3, seed: 1, assign: [], mu: [], phase: '2a', t: 0, halves: [],

  function lossNow() {                            // L = sum_k sum_{i in C_k} ||x_i - mu_k||^2
    let L = 0;
    for (let i = 0; i < Z.length; i++) L += zdist2(Z[i], S.mu[S.assign[i]]);
    return L;

    const rng = mulberry32(100 + S.seed);
    S.assign = Z.map(() => Math.floor(rng() * S.k));       // notes' step 1: random labels
    S.mu = [];                                             // no means yet — 2a will make them
    S.phase = '2a'; S.t = 0;
    S.halves = [];
    S.converged = false; S.lastChanged = null;
    renderAll();
  }
  function means(assign, fallback) {
    const sum = Array.from({ length: S.k }, () => [0, 0, 0]);
    for (let i = 0; i < Z.length; i++) {
      const c = assign[i];
      sum[c][0] += Z[i][0]; sum[c][1] += Z[i][1]; sum[c][2]++;
    }
    return sum.map((s, k2) => s[2] ? [s[0] / s[2], s[1] / s[2]]
      : (fallback[k2] || [0, 0]));                          // empty cluster keeps stale mean
  }
  function halfStep() {
    if (S.converged) return;
    if (S.phase === '2a') {
      S.t++;
      S.mu = means(S.assign, S.mu.length ? S.mu : Array.from({ length: S.k }, () => [0, 0]));
      S.phase = '2b';
      S.halves.push({ step: '2a', t: S.t, L: lossNow() });
    } else {
      const next = Z.map(z => {
        let best = 0, bd = Infinity;
        for (let c = 0; c < S.k; c++) { const d2 = zdist2(z, S.mu[c]); if (d2 < bd - 1e-15) { bd = d2; best = c; } }
        return best;
      });
      S.lastChanged = next.reduce((a, c, i) => a + (c !== S.assign[i] ? 1 : 0), 0);
      S.assign = next;
      S.phase = '2a';
      S.halves.push({ step: '2b', t: S.t, L: lossNow() });
      if (S.lastChanged === 0) {
        S.converged = true;
        S.bestL = S.bestL == null ? lossNow() : Math.min(S.bestL, lossNow());
      }
    }
    renderAll();
  }
  function runAll() { let g = 200; while (!S.converged && g-- > 0) halfStep(); }

    const gCent = svg.append('g');
    svg.append('rect').attr('class', 'frame').attr('width', pW).attr('height', pH);

    const lm = { top: 12, right: 14, bottom: 46, left: 60 }, lW = 400, lH = 300;
    const lroot = d3.select('#lossBody').append('svg')
      .attr('width', lW + lm.left + lm.right).attr('height', lH + lm.top + lm.bottom);
    const lsvg = lroot.append('g').attr('transform', `translate(${lm.left},${lm.top})`);
    const ldiv = d3.select('#lossBody');
    const gLAxis = lsvg.append('g').attr('class', 'tick').attr('transform', `translate(0,${lH})`);
    const gLYAxis = lsvg.append('g').attr('class', 'tick');
    const gLoss = lsvg.append('g');
    lsvg.append('rect').attr('class', 'frame').attr('width', lW).attr('height', lH);
    ldiv.append('div').attr('class', 'axislab').style('left', (lm.left + lW / 2) + 'px')
      .style('top', (lm.top + lH + 36) + 'px').style('transform', 'translate(-50%,-50%)')
      .text('half-step (2a, 2b, 2a, 2b, …)');
    ldiv.append('div').attr('class', 'axislab').style('left', (lm.left - 46) + 'px')
      .style('top', (lm.top + lH / 2) + 'px').style('transform', 'translate(-50%,-50%) rotate(-90deg)')
      .html('loss \\(L^{(t)}\\)');

    UI = { x, y, svg, div, pm, pW, pH, gVor, gPts, gRing, gCent,
           lsvg, ldiv, lm, lW, lH, gLAxis, gLYAxis, gLoss };
    typesetNow([document.getElementById('objline'), document.getElementById('lossBody'),
                document.getElementById('lead')]);
  }

  // ============================ render ========================================
  function renderAll() {
    for (const k2 of [2, 3, 4, 5]) d3.select('#k' + k2).classed('on', S.k === k2);
    d3.select('#btnReveal').classed('on', S.reveal);
    const { x, y } = UI;
    const toPx = mu => [x(mu[0] * SDS[0] + MEANS[0]), y(mu[1] * SDS[1] + MEANS[1])];

    // Voronoi cells of the current means (the "nearest mu" geometry) — standardized space,
    // rendered by mapping cell polygons back through the raw axes
    UI.gVor.selectAll('*').remove();
    const centPx = S.mu.map(toPx);
    if (S.mu.length) {
      // build voronoi in PIXEL space of the standardized coords mapped to raw: because both
      // axis maps are affine, nearest-in-z == nearest-in-pixel only if px scaling is equal
      // per axis; so compute cells in a scaled space: z * common scale.
      const sc = 170;
      const zpx = S.mu.map(m => [m[0] * sc, m[1] * sc]);
      const de = d3.Delaunay.from(zpx);
      const bounds = [-6 * sc, -6 * sc, 6 * sc, 6 * sc];
      const vor = de.voronoi(bounds);
      for (let c = 0; c < S.mu.length; c++) {
        const poly = vor.cellPolygon(c);
        if (!poly) continue;
        const path = poly.map(pp => {
          const zx = pp[0] / sc, zy = pp[1] / sc;
          return [x(zx * SDS[0] + MEANS[0]), y(zy * SDS[1] + MEANS[1])];
        });
        UI.gVor.append('path').attr('class', 'vor')
          .attr('d', 'M' + path.map(p => p.join(',')).join('L') + 'Z');
      }
    }

    UI.gPts.selectAll('circle').data(RAW).join('circle')
      .attr('class', 'pt').attr('r', 3.4)
      .attr('cx', r => x(r[0])).attr('cy', r => y(r[1]))
      .attr('fill', (r, i) => KCOL[S.assign[i]]);

    UI.gRing.selectAll('*').remove();
    if (S.reveal) {
      const dash = ['', '4 3', '1.5 2.5'];
      RAW.forEach((r, i) => UI.gRing.append('circle').attr('class', 'ring')
        .attr('r', 6).attr('cx', x(r[0])).attr('cy', y(r[1]))
        .attr('stroke-dasharray', dash[r[2]]));
    }

    UI.gCent.selectAll('*').remove();
    S.mu.forEach((m, c) => {
      const [cx, cy] = toPx(m);
      UI.gCent.append('path').attr('class', 'cent').attr('fill', KCOL[c])
        .attr('transform', `translate(${cx},${cy})`)
        .attr('d', d3.symbol().type(d3.symbolCross).size(230)());
    });

    // ---- loss staircase ----
    const H = S.halves;
    const lx = d3.scaleLinear([0, Math.max(9, H.length - 1)], [0, UI.lW]);
    const ext = d3.extent(H, h => h.L);
    const ly = d3.scaleLinear([Math.max(0, (ext[0] ?? 0) * 0.9), (ext[1] ?? 1) * 1.05], [UI.lH, 0]);
    UI.gLAxis.call(d3.axisBottom(lx).ticks(Math.min(10, Math.max(2, H.length))).tickFormat(d3.format('d')));
    UI.gLYAxis.call(d3.axisLeft(ly).ticks(6));
    UI.gLoss.selectAll('*').remove();
    UI.gLoss.append('path').attr('class', 'ltrace')
      .attr('d', d3.line().x((h, i) => lx(i)).y(h => ly(h.L))(H));
    H.forEach((h, i) => UI.gLoss.append('circle')
      .attr('class', h.step === '2a' ? 'ldotA' : 'ldotB').attr('r', 4.5)
      .attr('cx', lx(i)).attr('cy', ly(h.L)));
    document.getElementById('legend').innerHTML =
      `<span style="color:${A_COL};font-weight:700">●</span> after 2a (means recomputed) ` +
      `&nbsp; <span style="color:${B_COL};font-weight:700">●</span> after 2b (points reassigned)` +
      ` — each half-step can only go down`;

    // ---- the notes' dependency table (last 6 half-steps) ----
    if (!depSlot) depSlot = new MathSlot(document.getElementById('dep'), 'table');
    const rows = H.slice(-6).map(h => h.step === '2a'
      ? `<tr><td>2a</td><td class="fresh">\\(\\boldsymbol{\\mu}_k^{${h.t}}\\)</td><td class="stale">\\(C_k^{${h.t - 1}}\\)</td></tr>`
      : `<tr><td>2b</td><td class="stale">\\(\\boldsymbol{\\mu}_k^{${h.t}}\\)</td><td class="fresh">\\(C_k^{${h.t}}\\)</td></tr>`);
    depSlot.set(`<tr><th>step</th><th>\\(\\boldsymbol{\\mu}\\) at end</th><th>\\(C\\) at end</th></tr>` +
      (H.length > 6 ? `<tr><td>⋮</td><td>⋮</td><td>⋮</td></tr>` : '') + rows.join(''));

    renderFocal();
    renderButtons();
    // document.getElementById('beststrip').textContent =
    //   (S.bestL != null ? `best converged L across your restarts: ${S.bestL.toFixed(1)}` : '') +
    //   (S.converged ? `  ·  this run: ${S.halves.at(-1).L.toFixed(1)} after ${S.halves.length} half-steps` : '');

    window.__kmApi = {
      state: () => ({ k: S.k, phase: S.phase, t: S.t, converged: S.converged,
        halves: S.halves.map(h => ({ ...h })), lastChanged: S.lastChanged,
        assign: S.assign.slice(), mu: S.mu.map(m => m.slice()), bestL: S.bestL,
        L: S.mu.length ? lossNow() : null }),
      step: halfStep, run: runAll,
      restart: () => { S.seed++; restart(); },
      setK: k2 => { S.k = k2; S.seed++; restart(); },
      reveal: v => { S.reveal = v == null ? !S.reveal : v; renderAll(); },
      Z: () => Z.map(z => z.slice()),
      tex: () => ({ focal: focalSlot && focalSlot.cur, dep: depSlot && depSlot.cur })
    };
  }

  function renderFocal() {
    if (!focalSlot) focalSlot = new MathSlot(document.getElementById('focal'));
    const f = { set innerHTML(v) { focalSlot.set(v); } };
    const H = S.halves;
    if (!H.length) {
      // f.innerHTML = `<span class="stepno">step 1 done: every point got a random label 1..${S.k} — the clusters are pure noise and no means exist yet</span>` +
        // `press <b>2a</b> to compute the first means \\(\\boldsymbol{\\mu}_k^{1}\\) (they'll land uselessly in the middle — random labels average out)`;
      return;
    }
    const last = H.at(-1), prev = H.length > 1 ? H.at(-2) : null;
    const dL = prev ? ` \\; L: ${prev.L.toFixed(1)} \\rightarrow \\mathbf{${last.L.toFixed(1)}}` : ` \\; L^{(1)} = \\mathbf{${last.L.toFixed(1)}}`;
    // if (S.converged) {
    //   f.innerHTML = `<span class="stepno">step 2b changed 0 assignments → the means won't change either → <b>converged</b></span>` +
    //     `\\(L\\) went ${texc(B_COL, `\\mathbf{${H[0].L.toFixed(1)} \\rightarrow ${last.L.toFixed(1)}}`)} — ` +
    //     `monotone \\(\\downarrow\\), bounded below by 0, finitely many partitions: it had to stop.`;
    // } else if (last.step === '2a') {
    //   f.innerHTML = `<span class="stepno">2a at t=${last.t}: each \\(\\boldsymbol{\\mu}_k^{${last.t}}\\) = mean of its cluster \\(C_k^{${last.t - 1}}\\) — the mean minimizes the within-cluster sum of squares</span>` +
    //     `\\(\\boldsymbol{\\mu}_{kj} = \\tfrac{1}{|C_k|}\\sum_{i \\in C_k} x_{ij}${dL}\\)`;
    // } else {
    //   f.innerHTML = `<span class="stepno">2b at t=${last.t}: ${S.lastChanged} point${S.lastChanged === 1 ? '' : 's'} moved to a nearer center (Euclidean) — moving closer can only lower \\(L\\)</span>` +
    //     `\\(C_k^{${last.t}} = \\{i : \\|\\mathbf{x}_i - \\boldsymbol{\\mu}_k^{${last.t}}\\|_2 \\le \\|\\mathbf{x}_i - \\boldsymbol{\\mu}_{k'}^{${last.t}}\\|_2\\ \\forall k'\\}${dL}\\)`;
    // }
  }
  function renderButtons() {
    const b = document.getElementById('btnStep');
    if (S.converged) { b.disabled = true; b.textContent = 'Converged — restart or change k'; }
    else { b.disabled = false; b.textContent = S.phase === '2a' ? 'Step 2a: recompute the means' : 'Step 2b: reassign the points'; }
  }

  // ============================ boot ==========================================
  function main() {
    if (main.done) return; main.done = true;
    document.getElementById('objline').innerHTML =
      `\\(\\underset{C_1,\\dots,C_K}{\\text{minimize}} \\left\\{ \\sum_{k=1}^{K} \\sum_{i \\in C_k} \\|\\mathbf{x}_i - \\boldsymbol{\\mu}_k\\|_2^2 \\right\\}\\)`;
      // ` — and \\(\\tfrac{\\partial}{\\partial C_i}\\) is undefined (a <b>set</b>, not a number), so: alternate.`;
    for (const k2 of [2, 3, 4, 5])
      d3.select('#k' + k2).on('click', () => { S.k = k2; S.seed++; S.bestL = null; restart(); });
    d3.select('#btnStep').on('click', halfStep);
    d3.select('#btnRun').on('click', runAll);
    d3.select('#btnRestart').on('click', () => { S.seed++; restart(); });
    d3.select('#btnReveal').on('click', () => { S.reveal = !S.reveal; renderAll(); });
    build();
    restart();
  }
  window.addEventListener('load', main);
  </script>
</head>
<body>
  <h1>K-means</h1>
  <!-- <p class="lead" id="lead">You suspect the data has \(k\) clusters but nobody labelled them. K-means
    hunts for the \(k\) cluster <i>means</i>. The catch: the assignments \(C_1,\dots,C_K\) are sets,
    so there is no gradient to descend — instead, alternate two moves that each can only lower the
    loss: <b>2a</b> recompute each cluster's mean, <b>2b</b> send each point to its nearest mean.
    Watch the loss staircase down until nothing moves. (The penguins' species stay hidden from the
    algorithm — reveal them at the end.)</p>--> 

  <div class="controls">
    \(k\):
    <button id="k2" class="kbtn">2</button><button id="k3" class="kbtn on">3</button><button id="k4" class="kbtn">4</button><button id="k5" class="kbtn">5</button>
    <button id="btnStep" class="abtn">Step 2a: recompute the means</button>
    <button id="btnRun" class="gbtn">Run to convergence</button>
    <button id="btnRestart" class="gbtn">Restart (new random labels)</button>
    <button id="btnReveal" class="rbtn">Reveal true species</button>
  </div>

  <div id="objline"></div>
  <div id="focal"></div>

  <div class="wrap">
    <div class="panel">
      <h3>the data — colors = current clusters, ✚ = the k means, dashes = “nearest mean” cells</h3>
      <div id="scatBody" class="panel"></div>
      <!-- <div class="caption">distances are computed on standardized axes (k-means is scale-sensitive); -->
        <!-- step 1 assigned every point a random label — the first means sit uselessly in the middle</div> -->
    </div>
    <div class="panel" id="tablePanel">
      <h3>the loss, after every half-step</h3>
      <div id="lossBody" class="panel"></div>
      <div id="legend"></div>
      <div id="dep"></div>
      <div id="beststrip"></div>
    </div>
  </div>

  <!-- <p id="footnote">Convergence, exactly as in the notes: 2a lowers \(L\) because the mean minimizes
    the sum of squared distances for fixed assignments; 2b lowers \(L\) because each point moves to a
    (weakly) nearer center for fixed means. \(L \ge 0\), and there are only finitely many ways to
    partition the points, so the staircase must stop. Stopping is <i>not</i> the same as finding the
    best partition: k-means only reaches a <b>local</b> optimum. At \(k=3\) this data funnels nearly
    every random start to the same answer — but set \(k=4\) or \(5\) and restart a few times:
    the runs genuinely stop at different \(L\) (watch the best-so-far strip).</p> -->
</body>
</html>
