    SOURCES (kept in source; not displayed in the applet UI)

  {"key":"judges","label":"Judges","axes":["Integrity rating (out of 10)","Demeanor rating (out of 10)","Diligence rating (out of 10)"],"sameUnits":true,"pts":[[7.9,7.7,7.3],[8.9,8.8,8.5],[8.1,7.8,7.8],[8.8,8.5,8.8],[6.4,4.3,6.5],[8.8,8.7,8.5],[9.0,8.9,8.7],[5.9,4.9,5.1],[8.9,8.9,8.7],[7.9,6.7,8.1],[8.0,7.6,7.4],[8.0,7.6,7.2],[8.6,8.2,6.8],[7.5,6.4,6.8],[8.1,8.0,8.0],[8.0,7.4,7.7],[7.6,6.6,7.2],[7.7,6.7,7.5],[8.2,7.4,7.8],[6.9,5.7,6.6],[8.2,7.7,7.1],[7.3,6.9,6.8],[7.4,6.2,6.2],[8.3,8.1,7.7],[8.7,8.5,8.6],[8.9,8.7,8.9],[8.5,8.3,8.0],[9.0,8.9,8.7],[8.1,7.7,8.2],[9.2,9.0,9.0],[7.4,6.9,8.4],[8.0,7.9,7.9],[8.5,7.8,8.5],[8.9,8.8,8.7],[6.2,5.1,5.6],[8.3,8.1,8.3],[8.3,8.0,8.1],[8.2,7.7,7.8],[7.3,7.0,6.8],[8.2,7.8,8.3],[7.0,5.9,7.0],[8.4,8.4,7.7],[7.4,7.0,7.5]]}

// ------------------------------------------------------------------------------

const COL = ["#D55E00", "#0072B2", "#009E73"], CDOT = "#555";
const W = 600, H = 600, m = { t: 14, r: 14, b: 50, l: 62 };
const PW = W - m.l - m.r, PH = H - m.t - m.b;      // square plot
// S.keep = how many components are kept (dim = nothing flattened)
const S = { i: 0, dim: 2, keep: 2, yaw: -0.55, pitch: 0.38 };
let A = null, cur = null, anim = null;
let svg, g, frame, xAx, yAx, xT, yT, box, lab3, plane, line1, dots, arrows;

// Eigen-decomposition of a small symmetric matrix by Jacobi rotations.
// Returns [{val, vec}] sorted by decreasing eigenvalue.
function eigSym(Min) {
  const n = Min.length, M = Min.map(r => r.slice());
  const V = d3.range(n).map(i => d3.range(n).map(j => +(i === j)));
  for (let sweep = 0; sweep < 60; sweep++) {
    let off = 0;
    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += M[p][q] * M[p][q];
    if (off < 1e-22) break;
    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {
      if (Math.abs(M[p][q]) < 1e-300) continue;
      const th = 0.5 * Math.atan2(2 * M[p][q], M[q][q] - M[p][p]), c = Math.cos(th), s = Math.sin(th);
      for (let k = 0; k < n; k++) { const a = M[k][p], b = M[k][q]; M[k][p] = c * a - s * b; M[k][q] = s * a + c * b; }
      for (let k = 0; k < n; k++) { const a = M[p][k], b = M[q][k]; M[p][k] = c * a - s * b; M[q][k] = s * a + c * b; }
      for (let k = 0; k < n; k++) { const a = V[k][p], b = V[k][q]; V[k][p] = c * a - s * b; V[k][q] = s * a + c * b; }
    }
  }
  return d3.range(n).map(j => ({ val: M[j][j], vec: V.map(r => r[j]) })).sort((a, b) => b.val - a.val);
}

const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];

// PCA of one dataset in `dim` dimensions, in the coordinates that get drawn.
// Everything is stored as 3-vectors (third coordinate 0 in 2D).
function analyse(d, dim) {
  const n = d.pts.length, J = d3.range(dim);
  const mean = J.map(j => d3.mean(d.pts, p => p[j]));
  const sd = J.map(j => d.sameUnits ? 1 : d3.deviation(d.pts, p => p[j]));
  const U = d.pts.map(p => [0, 1, 2].map(j => j < dim ? (p[j] - mean[j]) / sd[j] : 0));   // drawn coordinates
  const C = J.map(a => J.map(b => d3.sum(U, u => u[a] * u[b]) / n));
  const E = eigSym(C);
  const comp = E.map(e => {
    let v = [0, 1, 2].map(j => j < dim ? e.vec[j] : 0);
    const big = d3.maxIndex(v, Math.abs);
    return { v, big, sd: Math.sqrt(Math.max(e.val, 0)) };
  });
  // signs: 1st arrow points right; the others point toward their largest coordinate
  comp.forEach((c, k) => { if ((k === 0 ? c.v[0] : c.v[c.big]) < 0) c.v = c.v.map(x => -x); });
  comp.forEach(c => { c.tip = c.v.map(x => 2 * c.sd * x); });          // arrows: 2 standard deviations long
  const score = U.map(u => comp.map(c => dot(u, c.v)));
  // where each dot lands when only the first k components are kept
  const flat = k => score.map(s => [0, 1, 2].map(j => d3.sum(d3.range(k), q => s[q] * comp[q].v[j])));
  const ext = comp.map((c, k) => d3.extent(score, s => s[k]));
  // cube window around the cloud and the arrow tips
  const all = U.concat(comp.map(c => c.tip));
  const lo = J.map(j => d3.min(all, u => u[j])), hi = J.map(j => d3.max(all, u => u[j]));
  const ctr = [0, 1, 2].map(j => j < dim ? (lo[j] + hi[j]) / 2 : 0);
  const half = 1.1 * d3.max(J, j => hi[j] - lo[j]) / 2;
  const range = J.map(j => d3.extent(d.pts, p => p[j]));              // original units (2D ticks stay inside)
  return { dim, mean, sd, U, comp, score, flat, ext, ctr, half, range };
}

// drawn coordinates -> pixels inside the plot group
function project(u) {
  const x = u[0] - A.ctr[0], y = u[1] - A.ctr[1], z = u[2] - A.ctr[2];
  if (S.dim === 2) { const k = PW / (2 * A.half); return [PW / 2 + k * x, PH / 2 - k * y, 0]; }
  const k = (PW / 2) / (A.half * 1.65);
  const ca = Math.cos(S.yaw), sa = Math.sin(S.yaw), cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
  const X = x * ca + y * sa, D = -x * sa + y * ca;                    // D = distance away from the viewer
  return [PW / 2 + k * X, PH / 2 - k * (z * cp + D * sp), (D * cp - z * sp) / A.half];
}

function build() {
  COL.forEach((c, k) => d3.select("#sw" + (k + 1)).style("border-color", c));

  d3.select("#dims").selectAll("button").data([2, 3]).join("button")
    .attr("type", "button").text(d => d + "D")
    .on("click", (ev, d) => { S.dim = d; S.keep = d; setData(); });
  d3.select("#picker").selectAll("button").data(DATASETS).join("button")
    .attr("type", "button").text(d => d.label)
    .on("click", (ev, d) => { S.i = DATASETS.indexOf(d); S.keep = S.dim; setData(); });

  svg = d3.select("#stage").append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H);
  const defs = svg.append("defs");
  COL.forEach((col, k) =>
    defs.append("marker").attr("id", "h" + k).attr("viewBox", "0 0 10 10").attr("refX", 8).attr("refY", 5)
      .attr("markerWidth", 5).attr("markerHeight", 5).attr("orient", "auto-start-reverse")
      .append("path").attr("d", "M0,0 L10,5 L0,10 z").attr("fill", col));

  g = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
  frame = g.append("rect").attr("width", PW).attr("height", PH).attr("fill", "#fafafa").attr("stroke", "#ccc");
  xAx = g.append("g").attr("transform", `translate(0,${PH})`);
  yAx = g.append("g");
  xT = svg.append("text").attr("class", "axt").attr("text-anchor", "middle").attr("font-size", 13.5)
    .attr("x", m.l + PW / 2).attr("y", H - 10);
  yT = svg.append("text").attr("class", "axt").attr("text-anchor", "middle").attr("font-size", 13.5)
    .attr("transform", `translate(15,${m.t + PH / 2}) rotate(-90)`);
  box = g.append("g").attr("stroke", "#bbb").attr("fill", "none");
  lab3 = g.append("g");
  plane = g.append("path").attr("fill", "#888").attr("fill-opacity", 0.13).attr("stroke", "#888").attr("stroke-width", 1);
  line1 = g.append("line").attr("stroke", COL[0]).attr("stroke-width", 1.5);
  dots = g.append("g");
  arrows = g.append("g");

  svg.call(d3.drag().on("drag", ev => {
    if (S.dim !== 3) return;
    S.yaw -= ev.dx * 0.01;
    S.pitch = Math.max(-0.15, Math.min(1.45, S.pitch + ev.dy * 0.01));
    draw();
  }));
}

// new dataset or new dimension: recompute, rebuild static parts, no animation
function setData() {
  const d = DATASETS[S.i];
  if (anim) { anim.stop(); anim = null; }
  A = analyse(d, S.dim);
  cur = A.flat(S.keep).map(p => p.slice());
  if (S.dim === 3) {   // opening view: the sheet of the first two components seen mostly, not exactly, face-on
    S.pitch = 0.38;
    const n = A.comp[2].v, cp = Math.cos(S.pitch), sp = Math.sin(S.pitch);
    const facing = a => Math.abs(-Math.sin(a) * cp * n[0] + Math.cos(a) * cp * n[1] - sp * n[2]);
    S.yaw = d3.least(d3.range(-1.4, 1.4, 0.05), a => Math.abs(facing(a) - 0.8) + 0.02 * Math.abs(a + 0.55));
  }
  document.body.classList.toggle("d3", S.dim === 3);

  d3.select("#dims").selectAll("button").classed("on", q => q === S.dim);
  d3.select("#picker").selectAll("button").classed("on", (q, i) => i === S.i);
  const opts = [{ keep: S.dim, label: "Full picture" }]
    .concat(S.dim === 3 ? [{ keep: 2, label: "Flatten to 2 dimensions" }] : [])
    .concat([{ keep: 1, label: "Flatten to 1 dimension" }]);
  d3.select("#flat").selectAll("button").data(opts, o => o.label).join("button")
    .attr("type", "button").text(o => o.label)
    .on("click", (ev, o) => { if (o.keep !== S.keep) { S.keep = o.keep; flatten(); } });

  const is2 = S.dim === 2;
  [xAx, yAx, xT, yT, frame].forEach(s => s.attr("display", is2 ? null : "none"));
  [box, lab3].forEach(s => s.attr("display", is2 ? "none" : null));
  if (is2) {   // axes in the original measurement units
    const dom = j => [A.mean[j] + (A.ctr[j] - A.half) * A.sd[j], A.mean[j] + (A.ctr[j] + A.half) * A.sd[j]];
    const xs = d3.scaleLinear().domain(dom(0)).range([0, PW]), ys = d3.scaleLinear().domain(dom(1)).range([PH, 0]);
    const inside = (sc, r) => sc.ticks(6).filter(v => v >= r[0] - 1e-9 && v <= r[1] + 1e-9);
    xAx.call(d3.axisBottom(xs).tickValues(inside(xs, A.range[0])).tickFormat(xs.tickFormat(6)).tickSizeOuter(0));
    yAx.call(d3.axisLeft(ys).tickValues(inside(ys, A.range[1])).tickFormat(ys.tickFormat(6)).tickSizeOuter(0));
    xT.text(d.axes[0]); yT.text(d.axes[1]);
  }
  lab3.selectAll("text").data(is2 ? [] : d.axes).join("text")
    .attr("class", "axt").attr("text-anchor", "middle").attr("font-size", 12.5).text(t => t);
  dots.selectAll("circle").data(cur).join("circle").attr("fill", CDOT).attr("fill-opacity", 0.55);
  arrows.selectAll("line").data(A.comp).join("line")
    .attr("stroke", (c, k) => COL[k]).attr("stroke-width", 4).attr("marker-end", (c, k) => `url(#h${k})`);
  styleFlat(0);
  draw();
  window.__api = { state: () => ({ ...S }), analysis: () => A, cur: () => cur, datasets: DATASETS };
}

// arrows of dropped components fade; the line / sheet the dots land on appears
function styleFlat(T) {
  d3.select("#flat").selectAll("button").classed("on", o => o.keep === S.keep);
  arrows.selectAll("line").interrupt().transition().duration(T).attr("opacity", (c, k) => k < S.keep ? 1 : 0);
  line1.interrupt().transition().duration(T).attr("opacity", S.keep === 1 ? 0.6 : 0);
  plane.interrupt().transition().duration(T).attr("opacity", S.dim === 3 && S.keep === 2 ? 1 : 0);
}

function flatten() {
  const from = cur.map(p => p.slice()), to = A.flat(S.keep), ease = d3.easeCubicInOut, T = 900;
  styleFlat(500);
  if (anim) anim.stop();
  anim = d3.timer(el => {
    const t = ease(Math.min(1, el / T));
    for (let i = 0; i < cur.length; i++) for (let j = 0; j < 3; j++) cur[i][j] = from[i][j] + t * (to[i][j] - from[i][j]);
    draw();
    if (el >= T) { anim.stop(); anim = null; }
  });
}

// positions only: called on every animation frame and every drag
function draw() {
  const is3 = S.dim === 3;
  dots.selectAll("circle").each(function (p) {
    const q = project(p);
    this.setAttribute("cx", q[0]); this.setAttribute("cy", q[1]);
    this.setAttribute("r", is3 ? 3.1 - 0.9 * q[2] : 3.2);            // nearer dots a little bigger
  });
  const o = project([0, 0, 0]);
  arrows.selectAll("line").each(function (c) {
    const q = project(c.tip);
    this.setAttribute("x1", o[0]); this.setAttribute("y1", o[1]); this.setAttribute("x2", q[0]); this.setAttribute("y2", q[1]);
  });
  const along = (k, t) => A.comp[k].v.map(x => t * x);
  const e1 = A.ext[0], p0 = project(along(0, e1[0])), p1 = project(along(0, e1[1]));
  line1.attr("x1", p0[0]).attr("y1", p0[1]).attr("x2", p1[0]).attr("y2", p1[1]);
  if (!is3) { plane.attr("d", null); return; }

  const e2 = A.ext[1], corner = (a, b) => { const u = along(0, a), w = along(1, b); return project([u[0] + w[0], u[1] + w[1], u[2] + w[2]]); };
  const quad = [corner(e1[0], e2[0]), corner(e1[1], e2[0]), corner(e1[1], e2[1]), corner(e1[0], e2[1])];
  plane.attr("d", "M" + quad.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join("L") + "Z");

  // cube frame and one name per variable, on the three edges leaving the low corner
  const h = A.half, c = A.ctr, P = (sx, sy, sz) => project([c[0] + sx * h, c[1] + sy * h, c[2] + sz * h]);
  const edges = [];
  [-1, 1].forEach(a => [-1, 1].forEach(b => {
    edges.push([P(-1, a, b), P(1, a, b)], [P(a, -1, b), P(a, 1, b)], [P(a, b, -1), P(a, b, 1)]);
  }));
  box.selectAll("line").data(edges).join("line")
    .attr("x1", e => e[0][0]).attr("y1", e => e[0][1]).attr("x2", e => e[1][0]).attr("y2", e => e[1][1]);
  // each name sits on the outermost of the four edges parallel to its variable
  const cen = [PW / 2, PH / 2], sgn = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
  const mids = [0, 1, 2].map(j => sgn.map(s => { const a = [s[0], s[1]]; a.splice(j, 0, 0); return P(a[0], a[1], a[2]); })
    .reduce((best, q) => Math.hypot(q[0] - cen[0], q[1] - cen[1]) + 0.15 * q[1] >
                         Math.hypot(best[0] - cen[0], best[1] - cen[1]) + 0.15 * best[1] + 1 ? q : best));
  lab3.selectAll("text").each(function (t, j) {
    const q = mids[j], dx = q[0] - cen[0], dy = q[1] - cen[1], L = Math.hypot(dx, dy) || 1;
    this.setAttribute("x", q[0] + 20 * dx / L); this.setAttribute("y", q[1] + 20 * dy / L + 4);
  });
}

function main() {
  if (main.done) return; main.done = true;
  build(); setData();
}
window.addEventListener("load", main);
</script>
