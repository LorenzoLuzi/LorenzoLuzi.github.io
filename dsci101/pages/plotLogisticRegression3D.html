<html>
    <head>
        <style>
            /* The font size of the numbers */
            input[type="number"]
            {
                font-size:16px;
            }
            
            /* The sliders */
            .slider {
              -webkit-appearance: none;
              width: 40%;
              height: 10px;
              border-radius: 2px;  
              background: #d3d3d3; /*Bar color*/
              outline: none;
              opacity: 0.7;
              -webkit-transition: .2s;
              transition: opacity .2s;
            }
            
            /* The buttons */
            .button {
              width: 7%;
            }
            
            /* Mouse-over effects */
            .slider::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              width: 25px;
              height: 25px;
              border-radius: 50%; 
              background: #0072BD; /*Dot color*/
              cursor: pointer;
            }

            /* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) and -moz- (Firefox) to override default look) */
            .slider::-moz-range-thumb {
              width: 25px;
              height: 25px;
              border-radius: 50%;
              background: #0072BD; /*Dot color*/
              cursor: pointer;
            }

            /* The style for the button */
            .button2 {
              /* border: none; */
              /* color: white; */
              padding: 15px 32px;
              text-align: center;
              /* text-decoration: none; */
              /* display: inline-block; */
              font-size: 16px;
              margin: 4px 2px;
              /* cursor: pointer; */
            }
            #plots {
              display: flex;
              justify-content: space-between; 
              width: 100%;  
            }
            #myplot1 {
              flex-shrink: 0; 
              flex-grow: 0;    
            }
            #myplot2 {
              width: 600px;
              height: 450px;
            }
        </style>

        <!-- Load libraries -->  
        <script src="https://www.x3dom.org/download/x3dom.js"></script>
        <link rel="stylesheet" href="https://www.x3dom.org/download/x3dom.css">
        <script src="https://d3js.org/d3.v7.js"></script>
        <script src="https://d3js.org/d3-random.v1.min.js"></script>
        <script type="text/x-mathjax-config">MathJax.Hub.Config({tex2jax: {inlineMath: [['$','$'], ['\\(','\\)']]}});</script> 
        <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS_HTML.js"></script>  
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
        <script src="../scripts/plottingFunctions.js"></script> 
        <script src="../scripts/twoDimensions.js"></script> 
        <script src="../scripts/threeDimensions.js"></script>
    <script src="../scripts/dataLoader.js"></script>
<script>


function getAccuracy(predictY, initialData) {
    // Function that calculates accuracy and assigns color and markers to the data based on it
    let correctCount = 0;
    const data = initialData.map(d => ({...d})); 

    data.forEach(d => {
        const pred_prob = predictY(d.x1, d.x2); 
        d.y_pred = (pred_prob / 10) - 5; 

        const pred_class = pred_prob > 50; 
        const true_class = d.y > 50; 
        
        if (pred_class === true_class) {
            correctCount++;
            d.marker = 'o'; 
        } else {
            d.marker = 'x'; 
        }
        d.color = (true_class) ? 'orange' : 'blue'; 
    });
    
    const accuracy = (correctCount / data.length) * 100;
    return { data: data, accuracy: accuracy }
}

// Variables to ensure that scene is only generated once
let isSceneInitialized = false;
let scene; 
let initialData;

function plotLogisticRegression3D() {
    // Colors used in plot
    let color_data = "#3070B7";
    let color_grid = "#d9c7d7";
    let color_estimate = "#377e22";

    // Font
    let font = 'Arial';

    removePlot("#myplot1");
    
    // Set the dimensions and margins of the graph
    var margin = {top: 60, right: 220, bottom: 80, left: 100},
                width = 800 - margin.left - margin.right,
                height = 450 - margin.top - margin.bottom;
                
    // Append the svg object to the body of the page
    var svg = appendSvg("#myplot1", width, height, margin);

    // Contains the code that only needs to be generated once.
    function renderPlot() {
        if (!isSceneInitialized) {
            scene = d3.select("#myplot2 scene");
            
            const scene_size = 10;
            const num_grid_lines = 21;
            const color_grid = "#E0E0E0";
            
            // Generate the data.
            initialData = getData("logistic3d", () => DataGen.logistic3d(50));
            
            drawGrid(scene, scene_size, num_grid_lines, color_grid);

            // Draw the axes
            const axisLength = scene_size / 2;
            drawAxis(scene, 'black', 'x1', [-axisLength, 0, 0], [axisLength, 0, 0], [axisLength + 0.8, 0, 0]);
            drawAxis(scene, 'black', 'x2', [0, 0, -axisLength], [0, 0, axisLength], [0, 0, axisLength + 0.8]);
            drawAxis(scene, 'black', 'y', [0, -axisLength, 0], [0, axisLength, 0], [0, axisLength + 0.8, 0]);

            // Draw the 3D title
            addTitle(`Surface Plot showing f(x)`, '#myplot2');

            // Get the initial slider values
            let c2_init = parseFloat(document.getElementById('c2Box').value) || 0;
            let c1_init = parseFloat(document.getElementById('c1Box').value) || 0;
            let b_init = parseFloat(document.getElementById('bBox').value) || 0;
            const predictY_init = (x1, x2) => 100 / (1 + Math.exp(-(c2_init * x2 + c1_init * x1 + b_init)));
            
            let { data, _ } = getAccuracy(predictY_init, initialData);
            
            drawPoints(scene, data, true); 

            isSceneInitialized = true;
        }
    }

    renderPlot();

    // Get c2, c1, and b from variables drawn from text fields
    let c2 = parseFloat(document.getElementById('c2Box').value) || 0;
    let c1 = parseFloat(document.getElementById('c1Box').value) || 0;
    let b = parseFloat(document.getElementById('bBox').value) || 0;

    // Set the function.
    const predictY = (x1, x2) => 100 / (1 + Math.exp(-(c2 * x2 + c1 * x1 + b)));

    drawPlane(scene, c2, c1, b, 10, color_estimate, true);
    drawDecisionBoundary3D(scene, c2, c1, b, 10, 'red');

    let { data, accuracy } = getAccuracy(predictY, initialData);

    // Redraw the points according to their new shapes.
    scene.selectAll(".data-points").remove();
    drawPoints(scene, data, true);
    
    // Min and max x and y
    let xmin = -5, xmax = 5

    // Add x axis
    let x1 = addXAxis(svg, xmin, xmax, width, height);

    // Add y axis
    let x2 = addYAxis(svg, xmin, xmax, width, height);

    // Grid lines
    drawGridlines(7, 9, width, height, color_grid);

    // Draw decision boundary line
    if (c2 != 0) {
        drawDecisionBoundary2D(svg, x1, x2, c1, c2, b, 'red');
    }

    // Add 2D dots
    addDots(svg, data, x1, x2, color_data, true, true);
    
    // Redraw 2D title
    addTitle(`Doing Logistic Regression Manually: accuracy = ${accuracy.toFixed(1)}%`, '#myplot1');

    // y label
    addYLabel(svg, font, height, -margin.left / 2, "x2");

    // x label
    addXLabel(svg, font, width, height, margin, "x1");

    d3.select("#legend").remove();

    // Legend entries
    addLegendEntry('#myplot1', "y=1; pred=1", "circle", 'orange', 200, -200);
    addLegendEntry('#myplot1', "y=1; pred=0", "x", 'orange', 200, -200);
    addLegendEntry('#myplot1', "y=0; pred=0", "x", 'blue', 200, -200);
    addLegendEntry('#myplot1', "y=0; pred=1", "circle", 'blue', 200, -200);

    // Find the solution to the regression
    function solveRegression() {
        document.getElementById('bSlider').value = 0.3;
        document.getElementById('bBox').value = 0.3;
        document.getElementById('c1Slider').value = 1.7;
        document.getElementById('c1Box').value = 1.7;
        document.getElementById('c2Slider').value = 1.7;
        document.getElementById('c2Box').value = 1.7;
    }

    window.solveRegression = solveRegression;
}
    </script>

    </head>

    <body onload="plotLogisticRegression3D();">

    <!-- Create a div where the graph will take place -->
    
    <div id="plots">
      <div id="myplot1"></div>
       <!-- Create the 3D plot -->
       <x3d id="myplot2">
        <scene>
            <Viewpoint position="3 10 20" centerOfRotation="0 0 0" orientation="1 0 0 -0.5"></Viewpoint>
        </scene>
      </x3d>
      </div>
        
      <center>
        <div>
        <!-- Create the sliders -->
        <form>
            <td>$c_2=$</td>
            <td><input id="c2Slider", type="range", name="c2Slider", size="7", class="slider", 
                    value="0.5", step="0.1", min="-5",  max="5", oninput="this.form.c2Box.value=this.value; plotLogisticRegression3D()"></td>
            <td><input id="c2Box", type="number", name="c2Box", size="20", class="button",
                    value="0.5", step="0.1", min="-5",  max="5", oninput="this.form.c2Slider.value=this.value; plotLogisticRegression3D()" /></td>
        </div>
        <div>
            <td>$c_1=$</td>
            <td><input id="c1Slider", type="range", name="c1Slider", size="7", class="slider", 
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.c1Box.value=this.value; plotLogisticRegression3D()">
            <input id="c1Box", type="number", name="c1Box", size="20", class="button",
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.c1Slider.value=this.value; plotLogisticRegression3D()" /></td>
        </div>
        <div>
            <td>$b=$</td>
            <td><input id="bSlider", type="range", name="bSlider", size="7", class="slider", 
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.bBox.value=this.value; plotLogisticRegression3D()">
            <input id="bBox", type="number", name="bBox", size="20", class="button",
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.bSlider.value=this.value; plotLogisticRegression3D()" /></td>
        </div>
    
        <!-- Create the solve button -->
        <div><button id="optimal", type="button", name="optimal", class="button2", 
                onclick="  
                    solveRegression();
                    plotLogisticRegression3D();">
            Solution!</button>
        </div>
        </form>
    </center>

    </body>


</html>
