<html>
    <head>
        <style>
            /* The font size of the numbers */
            input[type="number"]
            {
                font-size:16px;
            }
            
            /* The sliders */
            .slider {
              -webkit-appearance: none;
              width: 40%;
              height: 10px;
              border-radius: 2px;  
              background: #d3d3d3; /*Bar color*/
              outline: none;
              opacity: 0.7;
              -webkit-transition: .2s;
              transition: opacity .2s;
            }
            
            /* The buttons */
            .button {
              width: 7%;
            }
            
            /* Mouse-over effects */
            .slider::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              width: 25px;
              height: 25px;
              border-radius: 50%; 
              background: #0072BD; /*Dot color*/
              cursor: pointer;
            }

            /* The slider handle (use -webkit- (Chrome, Opera, Safari, Edge) and -moz- (Firefox) to override default look) */
            .slider::-moz-range-thumb {
              width: 25px;
              height: 25px;
              border-radius: 50%;
              background: #0072BD; /*Dot color*/
              cursor: pointer;
            }

            /* The style for the button */
            .button2 {
              /* border: none; */
              /* color: white; */
              padding: 15px 32px;
              text-align: center;
              /* text-decoration: none; */
              /* display: inline-block; */
              font-size: 16px;
              margin: 4px 2px;
              /* cursor: pointer; */
            }
        </style>

        <!-- Load libraries -->  
        <script src="https://d3js.org/d3.v7.js"></script> 
        <script type="text/x-mathjax-config">MathJax.Hub.Config({tex2jax: {inlineMath: [['$','$'], ['\\(','\\)']]}});</script> 
        <script type="text/javascript" src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS_HTML.js"></script>  
        <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
        <script src="../scripts/plottingFunctions.js"></script> 
        <script src="../scripts/twoDimensions.js"></script> 
    <script src="../scripts/dataLoader.js"></script>
<script>
function plotSimpleLinearRegression() {
    // Colors used in plot
    let color_data = "#3070B7";
    let color_estimate = "#377e22";
    let color_residuals = "red";
    let color_grid = "#d9c7d7";

    // Font
    let font = 'Arial';

    d3.select("#legend").remove();
    removePlot("#myplot");
    
    // Set the dimensions and margins of the graph
    var margin = {top: 60, right: 150, bottom: 80, left: 60},
                width = 700 - margin.left - margin.right,
                height = 450 - margin.top - margin.bottom;
                
    
    // Append the svg object to the body of the page
    var svg = appendSvg("#myplot", width, height, margin);
            
    // Read the data
    loadCSV("https://raw.githubusercontent.com/lorenzoluzi/public_data/master/simple_data.csv")
        .then(function(data) {
        // Get m and b from variables drawn from text fields
        let m = parseFloat(document.getElementById('mBox').value);
        let b = parseFloat(document.getElementById('bBox').value);

        // Set the function.
        const predictLinear = x => m * x + b;

        // Min and max x and y
        let { xmin, xmax, ymin, ymax } = getMinMax(data, predictLinear);

        // Add x axis
        let x = addXAxis(svg, xmin, xmax, width, height);

        // Add y axis
        let y = addYAxis(svg, ymin, ymax, width, height);

        // Grid lines
        // Line strokes: https://observablehq.com/@onoratod/animate-a-path-in-d3
        drawGridlines(7, 9, width, height, color_grid);

        // Draw Residuals
        drawResiduals(svg, data, color_residuals, x, y, predictLinear);
        

        // Draw line for estimate
        drawEstimateLine(svg, x, y, xmin, xmax, predictLinear, color_estimate);

        // Add dots
        addDots(svg, data, x, y, color_data);
        
        // Calculate error
        let error = calcError(data, predictLinear);

        // Title
        addTitle(`Simple Linear Regression: m = ${m.toFixed(2)}, b = ${b.toFixed(2)}, total error = ${error.toFixed(2)}`, '#myplot', '0px');

        // Y label
        addYLabel(svg, font, height, -margin.left/2, "Y values");

        // X label
        addXLabel(svg, font, width, height, margin, "X values");

        // Data entry
        addLegendEntry('#myplot', "Data", "circle", color_data, 150, -400);

        // Residuals entry
        addLegendEntry('#myplot', "Residuals", "line", color_residuals, 150, -400);

        // Estimate entry
        addLegendEntry('#myplot', "Estimate mx + b", "line", color_estimate, 150, -400);

        // Find the solution to the regression
        function solveRegression() {
            // Extract X and y matrices
            const X = data.map(d => [1, d.x]);
            const y = data.map(d => d.y);

            // Matrix multiplication
            const X_t = math.transpose(X);
            const X_tX = math.multiply(X_t, X);
            const coefs = math.multiply(math.inv(X_tX), math.multiply(X_t, y));

            // Extract coefficients and assign them to the box and sliders
            const b = +coefs[0].toFixed(4);
            const m = +coefs[1].toFixed(4);

            document.getElementById('bBox').value = b;
            document.getElementById('bSlider').value = b;
            document.getElementById('mBox').value = m;
            document.getElementById('mSlider').value = m;
        }

        window.solveRegression = solveRegression;

    })

}
    </script>

    </head>

    <body onload="plotSimpleLinearRegression();">

    <!-- Create a div where the graph will take place -->
    <center>
        <div id="myplot"></div>
        <div>
        <!-- Create the sliders -->
        <form>
            <td>$m=$</td>
            <td><input id="mSlider", type="range", name="mSlider", size="7", class="slider", 
                    value="0.5", step="0.1", min="-5",  max="5", oninput="this.form.mBox.value=this.value; plotSimpleLinearRegression()"></td>
            <td><input id="mBox", type="number", name="mBox", size="20", class="button",
                    value="0.5", step="0.1", min="-5",  max="5", oninput="this.form.mSlider.value=this.value; plotSimpleLinearRegression()" /></td>
        </div>
        <div>
            <td>$b=$</td>
            <td><input id="bSlider", type="range", name="bSlider", size="7", class="slider", 
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.bBox.value=this.value; plotSimpleLinearRegression()">
            <input id="bBox", type="number", name="bBox", size="20", class="button",
                    value="-0.5", step="0.1", min="-5", max="5", oninput="this.form.bSlider.value=this.value; plotSimpleLinearRegression()" /></td>
        </div>
    
        <!-- Create the solution button -->
        <div><button id="optimal", type="button", name="optimal", class="button2", 
                onclick="  
                    solveRegression();
                    plotSimpleLinearRegression();">
            Solution!</button>
        </div>
        </form>
    </center>

    </body>


</html>
