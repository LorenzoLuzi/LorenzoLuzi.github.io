  <meta charset="utf-8">

  <title>K-Nearest Neighbors</title>

  <!--
    SOURCES (kept in source; not displayed in the applet UI)
    - Penguins : palmerpenguins (Gorman, Williams & Fraser 2014), datasets/penguins.csv
                 (342 birds with both measurements; columns bill length, flipper length, species)
    - Cars     : ISLR Auto (1970-82), datasets/auto_mpg.csv (392 cars; weight, horsepower, mpg)
    HOW "NEAREST" IS MEASURED: with two features each one is z-scored first, and the plot
    is drawn with the same number of standard deviations per pixel on both axes. So the
    nearest dots on the screen ARE the nearest neighbours and the reach is a true circle.
    TIES: equal distances are broken by row order. A tied vote goes to the tied class
    that has the single closest neighbour.
    The last slider stop ("all") uses every case, so the guess is the same everywhere.
  -->

    .kn-k input { width: 260px; vertical-align: middle; }
    .kn-all { font-size: 15px; cursor: pointer; }
    .kn-q { font-size: 17px; font-weight: bold; margin: 14px 0 4px 0; }

    svg { display: block; max-width: 100%; height: auto; }
    #stage svg { touch-action: none; cursor: pointer; }
    .tick text { font-size: 11px; fill: #555; }

    .kn-ans { min-height: 118px; margin-top: 6px; font-size: 16px; }
    .kn-ans-t { margin-bottom: 6px; }
    .kn-votes { display: flex; height: 20px; }

    .kn-guess { font-size: 20px; }

    .kn-striplab { font-size: 14.5px; color: #333; margin-top: 8px; }

  if (v.task === "reg") {
    v.yRange = d3.extent(v.y);
    v.color = d3.scaleSequential(d3.interpolateViridis).domain(v.yRange);
  }
  // window: in 2 features the same number of standard deviations per pixel on both axes
  if (v.dim === 2) {
    const z = J.map(j => v.range[j].map(x => (x - v.mean[j]) / v.sd[j]));
    const half = 1.06 * d3.max(z, e => e[1] - e[0]) / 2;
    v.dom = J.map(j => { const c = (z[j][0] + z[j][1]) / 2; return [c - half, c + half].map(t => v.mean[j] + v.sd[j] * t); });
    v.PH = PW;
  } else {
    const pad = 0.04 * (v.range[0][1] - v.range[0][0]);
    v.dom = [[v.range[0][0] - pad, v.range[0][1] + pad]];
    v.PH = v.task === "reg" ? 380 : 250;
  }
  v.H = m.t + v.PH + m.b;
  v.sx = d3.scaleLinear().domain(v.dom[0]).range([m.l, m.l + PW]);
  if (v.dim === 2) v.sy = d3.scaleLinear().domain(v.dom[1]).range([m.t + v.PH, m.t]);
  else if (v.task === "reg") v.sy = d3.scaleLinear().domain(v.yRange).nice().range([m.t + v.PH, m.t]);
  v.keys = new Float64Array(n);
  v.ready = true;
  return v;
}

// Every case, sorted from nearest to farthest from q. Ties go to the earlier row.
function sortedKeys(v, q) {
  const keys = v.keys, X = v.X, sd = v.sd, n = v.n;
  for (let i = 0; i < n; i++) {
    let d2 = 0;
    for (let j = 0; j < v.dim; j++) { const t = (q[j] - X[i][j]) / sd[j]; d2 += t * t; }
    keys[i] = Math.round(d2 * 1e7) * 512 + i;            // distance and row index packed in one sortable number
  }
  keys.sort();
  return keys;
}
function nearest(v, q) { return Array.from(sortedKeys(v, q), key => key % 512); }
const kNow = v => Math.min(KS[S.ki], v.n);

// The guess from the first k rows of `order` (any array-like of row indices, nearest first).
function guess(v, order, k, off = 0) {
  if (v.task === "reg") {
    let s = 0;
    for (let i = 0; i < k; i++) s += v.y[order[off + i]];
    return { value: s / k };
  }
  const counts = v.classes.map(() => 0), first = v.classes.map(() => -1);
  for (let i = 0; i < k; i++) { const c = v.y[order[off + i]]; if (first[c] < 0) first[c] = i; counts[c]++; }
  const top = d3.max(counts);
  const tied = d3.range(counts.length).filter(c => counts[c] === top);
  const win = tied.reduce((a, b) => first[a] <= first[b] ? a : b);
  return { counts, win, tie: tied.length > 1 };
}
// distance (in the units the picture is drawn in) from q to its k-th nearest case, per axis
function reach(v, q, order, k) {
  const far = v.X[order[k - 1]];
  const d = Math.sqrt(d3.sum(d3.range(v.dim), j => ((q[j] - far[j]) / v.sd[j]) ** 2));
  return d3.range(v.dim).map(j => d * v.sd[j]);
}

// ---- the picture (rebuilt when the task or the number of features changes) ---------
// one-sided beeswarm: true x, dots stacked upward so none overlap
function swarm(v, base) {
  const px = v.X.map(x => v.sx(x[0])), idx = d3.range(v.n).sort((a, b) => px[a] - px[b]), cy = new Array(v.n), placed = [];
  for (const i of idx) {
    let up = 0, moved = true;
    while (moved) {
      moved = false;
      for (let p = placed.length - 1; p >= 0; p--) {
        const j = placed[p], dx = px[i] - px[j];
        if (dx > 2 * R) break;
        const need = Math.sqrt(4 * R * R - dx * dx) + 0.3;
        if (Math.abs(up - cy[j]) < need - 1e-9) { up = cy[j] + need; moved = true; }
      }
    }
    cy[i] = up; placed.push(i);
  }
  return { px, py: cy.map(u => base - u) };
}

function build() {
  V = prep(VIEWS[S.task + S.dim]);
  const v = V, top = m.t, bot = m.t + v.PH;
  d3.select("#stage").selectAll("*").remove();
  const svg = d3.select("#stage").append("svg").attr("viewBox", `0 0 ${W} ${v.H}`).attr("width", W).attr("height", v.H);
  svg.append("clipPath").attr("id", "plotclip").append("rect").attr("x", m.l).attr("y", top).attr("width", PW).attr("height", v.PH);
  svg.append("rect").attr("x", m.l).attr("y", top).attr("width", PW).attr("height", v.PH).attr("fill", "#fff").attr("stroke", "#ccc");
  const inside = svg.append("g").attr("clip-path", "url(#plotclip)");
  L = { svg };
  L.map = inside.append("image").attr("x", m.l).attr("y", top).attr("width", PW).attr("height", v.PH).attr("preserveAspectRatio", "none");
  L.strip = inside.append("g");                                           // 1 feature, classes: the guess along the axis
  L.reach = inside.append(v.dim === 2 ? "ellipse" : "rect").attr("fill", "#000").attr("fill-opacity", 0.07).attr("stroke", "#555").attr("stroke-width", 1);
  L.lines = inside.append("g").attr("stroke", "#111").attr("stroke-opacity", 0.35);

  // where each case is drawn
  if (v.dim === 2) { v.px = v.X.map(x => v.sx(x[0])); v.py = v.X.map(x => v.sy(x[1])); }
  else if (v.task === "reg") { v.px = v.X.map(x => v.sx(x[0])); v.py = v.y.map(y => v.sy(y)); }
  else { v.qy = bot - 12 - 13; Object.assign(v, swarm(v, v.qy - 13 - R - 2)); }
  const fill = v.task === "cls" ? i => CLS_COL[v.y[i]] : v.dim === 2 ? i => v.color(v.y[i]) : () => NEUTRAL;
  L.dots = inside.append("g").selectAll("circle").data(d3.range(v.n)).join("circle")
    .attr("r", R).attr("cx", i => v.px[i]).attr("cy", i => v.py[i]).attr("fill", fill);
  L.curve = inside.append("path").attr("fill", "none").attr("stroke", ACCENT).attr("stroke-width", 2);     // 1 feature, number: every guess
  L.avg = inside.append("line").attr("stroke", ACCENT).attr("stroke-width", 3);
  L.query = svg.append("circle").attr("r", 8).attr("stroke", "#111").attr("stroke-width", 2.5);

  // axes: tick numbers only where there is data
  const xAx = d3.axisBottom(v.sx).tickValues(d3.ticks(v.range[0][0], v.range[0][1], 7));
  svg.append("g").attr("transform", `translate(0,${bot})`).call(xAx);
  svg.append("text").attr("class", "axt").attr("x", m.l + PW / 2).attr("y", bot + 38).attr("text-anchor", "middle").attr("font-size", 14).text(v.axes[0]);
  if (v.sy) {
    const yAx = v.dim === 2 ? d3.axisLeft(v.sy).tickValues(d3.ticks(v.range[1][0], v.range[1][1], 7)) : d3.axisLeft(v.sy).ticks(7);
    svg.append("g").attr("transform", `translate(${m.l},0)`).call(yAx);
    svg.append("text").attr("class", "axt").attr("transform", `translate(18,${top + v.PH / 2}) rotate(-90)`).attr("text-anchor", "middle").attr("font-size", 14)
      .text(v.dim === 2 ? v.axes[1] : v.outName);
  }

  // drag the new case
  const move = e => {
    const [x, y] = d3.pointer(e, svg.node());
    v.q[0] = Math.max(v.dom[0][0], Math.min(v.dom[0][1], v.sx.invert(x)));
    if (v.dim === 2) v.q[1] = Math.max(v.dom[1][0], Math.min(v.dom[1][1], v.sy.invert(y)));
    draw();
  };
  svg.on("pointerdown", e => { dragging = true; try { svg.node().setPointerCapture(e.pointerId); } catch (_) {} move(e); })
     .on("pointermove", e => { if (dragging) move(e); })
     .on("pointerup pointercancel", () => { dragging = false; });

  // words
  d3.select("#q").text(`${v.ask} Drag it ${v.dim === 2 ? "anywhere" : "left and right"}.`);
  d3.select("#alllab").text(`Show the guess for every possible new ${v.one}`);
  const leg = [];
  if (v.task === "cls") v.classes.forEach((c, i) => leg.push(`<span><i style="background:${CLS_COL[i]}"></i>${c}</span>`));
  else if (v.dim === 1) leg.push(`<span><i style="background:${NEUTRAL}"></i>one ${v.one}</span>`);
  leg.push(`<span><i style="border:2px solid #111"></i>the k nearest</span>`);
  leg.push(`<span><i style="border:2.5px solid #111;width:15px;height:15px;vertical-align:-3px;background:${v.task === "reg" && v.dim === 1 ? ACCENT : "#ddd"}"></i>the new ${v.one}${v.task === "reg" && v.dim === 1 ? ", at our guess" : ", colored by our guess"}</span>`);
  d3.select("#legend").html(leg.join(""));
  d3.select("#ans").html("");
  L.ans = null;
  draw();
}

// ---- everything that changes with k or with the new case ----------------------------
function draw() {
  const v = V, k = kNow(v), top = m.t, bot = m.t + v.PH;
  const order = nearest(v, v.q), g = guess(v, order, k), r = reach(v, v.q, order, k);
  v.last = { order, g, k };
  const qx = v.sx(v.q[0]), near = new Uint8Array(v.n);
  for (let i = 0; i < k; i++) near[order[i]] = 1;

  L.dots.attr("fill-opacity", i => near[i] ? 1 : 0.5)
        .attr("stroke", i => near[i] ? "#111" : (v.task === "reg" && v.dim === 2 ? "#fff" : "none"))
        .attr("stroke-width", i => near[i] ? 1.5 : 0.5);
  L.dots.filter(i => near[i]).raise();

  const gcol = v.task === "cls" ? CLS_COL[g.win] : v.dim === 2 ? v.color(g.value) : ACCENT;
  if (v.dim === 2) {
    const qy = v.sy(v.q[1]), kx = Math.abs(v.sx(v.q[0] + r[0]) - qx);
    L.reach.attr("cx", qx).attr("cy", qy).attr("rx", kx).attr("ry", Math.abs(v.sy(v.q[1] + r[1]) - qy));
    L.lines.selectAll("line").data(k <= 30 ? order.slice(0, k) : []).join("line")
      .attr("x1", qx).attr("y1", qy).attr("x2", i => v.px[i]).attr("y2", i => v.py[i]);
    L.query.attr("cx", qx).attr("cy", qy).attr("fill", gcol);
    L.avg.attr("display", "none");
  } else {
    const x0 = v.sx(v.q[0] - r[0]), x1 = v.sx(v.q[0] + r[0]);
    L.reach.attr("x", x0).attr("y", top - 2).attr("width", Math.max(x1 - x0, 1)).attr("height", v.PH + 4);
    if (v.task === "reg") {
      const y = v.sy(g.value);
      L.avg.attr("display", null).attr("x1", x0).attr("x2", x1).attr("y1", y).attr("y2", y);
      L.query.attr("cx", qx).attr("cy", y).attr("fill", gcol);
    } else {
      L.avg.attr("display", "none");
      L.query.attr("cx", qx).attr("cy", v.qy).attr("fill", gcol);
    }
  }
  everyAnswer();
  answer();
  d3.select("#kval").text(KS[S.ki] === Infinity ? `k = all ${v.n}` : `k = ${k}`);
}

// The guess for every possible new case (the switch).
function everyAnswer() {
  const v = V, k = kNow(v), bot = m.t + v.PH;
  L.map.attr("display", "none"); L.strip.attr("display", "none"); L.curve.attr("display", "none");
  if (!S.all) return;
  if (v.dim === 1) {
    const xs = d3.range(0, PW + 1, 1), gs = xs.map(p => guess(v, nearest(v, [v.sx.invert(m.l + p)]), k));
    if (v.task === "reg") {
      const line = d3.line().x((d, i) => m.l + xs[i]).y(d => v.sy(d.value)).curve(d3.curveStepAfter);
      L.curve.attr("display", null).attr("d", line(gs));
    } else {
      const runs = [];                                                    // merge neighbouring pixels with the same guess
      gs.forEach((d, i) => { const last = runs[runs.length - 1]; if (last && last.c === d.win) last.b = xs[i] + 1; else runs.push({ c: d.win, a: xs[i], b: xs[i] + 1 }); });
      L.strip.attr("display", null).selectAll("rect").data(runs).join("rect")
        .attr("x", d => m.l + d.a).attr("width", d => d.b - d.a).attr("y", bot - 12).attr("height", 12).attr("fill", d => CLS_COL[d.c]);
    }
    return;
  }
  // 2 features: a GRID x GRID map. The nearest KEEP cases of every cell are found once and reused for every k.
  const G = GRID, n = v.n, keep = Math.min(KEEP, n);
  if (!v.grid) {
    v.grid = new Uint16Array(G * G * keep);
    for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
      const keys = sortedKeys(v, [v.sx.invert(m.l + (i + 0.5) / G * PW), v.sy.invert(m.t + (j + 0.5) / G * v.PH)]);
      const off = (j * G + i) * keep;
      for (let t = 0; t < keep; t++) v.grid[off + t] = keys[t] % 512;
    }
  }
  const canvas = document.createElement("canvas"); canvas.width = G; canvas.height = G;
  let ctx = null; try { ctx = canvas.getContext("2d"); } catch (_) {}
  if (!ctx) return;
  const img = ctx.createImageData(G, G);
  const whole = k > keep ? guess(v, d3.range(n), n) : null;                // k = all: one guess everywhere
  const rgbOf = g => d3.rgb(v.task === "cls" ? CLS_COL[g.win] : v.color(g.value));
  const wrgb = whole && rgbOf(whole);
  for (let c = 0; c < G * G; c++) {
    const rgb = wrgb || rgbOf(guess(v, v.grid, k, c * keep));
    img.data[4 * c] = rgb.r; img.data[4 * c + 1] = rgb.g; img.data[4 * c + 2] = rgb.b; img.data[4 * c + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  L.map.attr("display", null).attr("href", canvas.toDataURL()).attr("opacity", v.task === "cls" ? 0.3 : 0.6)
       .style("image-rendering", v.task === "cls" ? "pixelated" : "auto");
}

// The answer, spelled out under the picture.
function answer() {
  const v = V, { order, g, k } = v.last, box = d3.select("#ans");
  const who = k === v.n ? `All ${v.n} ${v.many}` : k === 1 ? `The nearest ${v.one}` : `The ${k} nearest ${v.many}`;
  if (v.task === "cls") {
    if (!L.ans) {
      box.html(`<div class="kn-ans-t"></div><div class="kn-votes"></div><div class="kn-tally"></div><div class="kn-guess"></div>`);
      L.ans = true;
    }
    const by = d3.range(v.classes.length).filter(c => g.counts[c] > 0).sort((a, b) => (b === g.win) - (a === g.win) || g.counts[b] - g.counts[a]);
    box.select(".kn-ans-t").text(`${who} ${k === 1 ? "votes" : "vote"}:`);
    const cells = by.flatMap(c => d3.range(g.counts[c]).map(() => c));
    box.select(".kn-votes").style("gap", k <= 50 ? "2px" : "0").selectAll("span").data(cells).join("span").style("background", c => CLS_COL[c]);
    box.select(".kn-tally").html(by.map(c => `<span><i style="background:${CLS_COL[c]}"></i>${g.counts[c]} ${v.classes[c]}</span>`).join(""));
    box.select(".kn-guess").html(`Our guess: <b style="color:${CLS_COL[g.win]}">${v.classes[g.win]}</b>` +
      (g.tie ? `<span class="tie">a tie, so the closest one decides</span>` : ""));
    return;
  }
  const num = d3.format(".1f")(g.value);
  if (!L.ans) {
    box.html(`<div class="kn-ans-t"></div><div class="kn-guess"></div><div id="strip"></div>`);
    L.ans = true;
    if (v.dim === 2) buildStrip();
  }
  box.select(".kn-ans-t").text(k === 1 ? `${who} gets:` : `${who} average:`);
  box.select(".kn-guess").html(`Our guess: <b>${num} ${v.unit}</b>`);
  if (v.dim === 2) {
    const s = L.stripScale;
    L.stripTicks.selectAll("line").data(order.slice(0, k)).join("line")
      .attr("x1", i => s(v.y[i])).attr("x2", i => s(v.y[i])).attr("y1", 4).attr("y2", 22);
    L.stripMark.attr("transform", `translate(${s(g.value)},24)`);
  }
}
// 2 features, number: the color key, with one line per nearest case and a triangle at their average
function buildStrip() {
  const v = V, H = 62, a = m.l, b = m.l + PW;
  d3.select("#strip").html(`<div class="kn-striplab">Color = ${v.unit}. Each line is one of the nearest ${v.many}, the triangle is their average.</div>`);
  const svg = d3.select("#strip").append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).attr("height", H);
  const s = L.stripScale = d3.scaleLinear().domain(v.yRange).range([a, b]);
  const grad = svg.append("defs").append("linearGradient").attr("id", "kngrad");
  d3.range(0, 1.001, 0.1).forEach(t => grad.append("stop").attr("offset", t).attr("stop-color", d3.interpolateViridis(t)));
  svg.append("rect").attr("x", a).attr("y", 6).attr("width", b - a).attr("height", 14).attr("fill", "url(#kngrad)");
  L.stripTicks = svg.append("g").attr("stroke", "#111").attr("stroke-width", 1.2).attr("stroke-opacity", 0.7);
  L.stripMark = svg.append("path").attr("d", "M0,0L7,11L-7,11Z").attr("fill", "#111");
  svg.append("g").attr("transform", `translate(0,36)`).call(d3.axisBottom(s).ticks(8).tickSize(4)).select(".domain").remove();
}

// ---- controls -------------------------------------------------------------------------
function buttons(sel, items, key) {
  const b = d3.select(sel).selectAll("button").data(items).join("button").text(d => d.label)
    .on("click", (e, d) => { S[key] = d.value; b.classed("on", x => x.value === S[key]); build(); });
  b.classed("on", d => d.value === S[key]);
}

function main() {
  if (main.done) return; main.done = true;
  buttons("#task", [{ label: "Classification", value: "cls" }, { label: "Regression", value: "reg" }], "task");
  buttons("#dims", [{ label: "1 feature", value: 1 }, { label: "2 features", value: 2 }], "dim");
  d3.select("#k").attr("max", KS.length - 1).property("value", S.ki).on("input", function () { S.ki = Math.max(0, Math.min(KS.length - 1, Math.round(+this.value))); draw(); });
  d3.select("#all").property("checked", S.all).on("change", function () { S.all = this.checked; draw(); });
  build();
  window.__api = { S, VIEWS, KS, view: () => V, nearest, guess, kNow, setQ: q => { V.q = q.slice(); draw(); } };
}
window.addEventListener("load", main);
</script>
</body>
</html>
